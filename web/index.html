<!DOCTYPE html>
<html lang="no">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FC Bønder</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="wrapper">

    <header>

        <h1>FC Bønder</h1>

        <nav class="dashboard-nav" aria-label="Hovedmeny">
            <a href="#players"><span class="nav-icon" aria-hidden="true">⚽</span>Spillere</a>
            
            <a href="#history"><span class="nav-icon" aria-hidden="true">📈</span>Historikk</a>
        </nav>

        <select id="playerSelect"></select>

    </header>

    <div id="players">
        <div id="playerCard"></div>
    </div>

    <section id="history" class="history-section" aria-labelledby="historyTitle">

        <div class="history-heading">
            <div>
                <h2 id="historyTitle">Utvikling over tid</h2>
                <p id="historySummary" class="history-summary"></p>
            </div>

            <label class="history-control" for="historyMetric">
                Parameter
                <select id="historyMetric"></select>
            </label>
        </div>

        <div id="historyChart" class="history-chart"></div>

    </section>

</div>

<script src="app.js"></script>

</body>
</html>
