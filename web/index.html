<!DOCTYPE html>
<html lang="no">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FCB Dashboard</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="wrapper">

    <header>

        <h1>FCB Dashboard</h1>

        <select id="playerSelect"></select>

    </header>

    <div id="playerCard"></div>

    <section class="history-section" aria-labelledby="historyTitle">

        <div class="history-heading">
            <div>
                <h2 id="historyTitle">Utvikling over tid</h2>
                <p id="historySummary" class="history-summary"></p>
            </div>

            <label class="history-control" for="historyMetric">
                Parameter
                <select id="historyMetric"></select>
            </label>
        </div>

        <div id="historyChart" class="history-chart"></div>

    </section>

</div>

<script src="app.js"></script>

</body>
</html>
